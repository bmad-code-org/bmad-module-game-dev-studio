# HOW TO CUSTOMIZE:
# 1. Create an override file with only the fields you want to change:
#      _bmad/customizations/gds-agent-tech-writer.toml       (team/org, committed to git)
#      _bmad/customizations/gds-agent-tech-writer.user.toml   (personal, gitignored)
